server:
  port: 0

spring:
  datasource:
    driverClassName: org.postgresql.Driver
    url: ${MAIN_DB_URL:jdbc:postgresql://localhost:5434/main_db}
    username: ${MAIN_DB_USER:postgres}
    password: ${MAIN_DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    show-sql: false
    open-in-view: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

stats-service:
  service-id: stats-service

grpc:
  client:
    collector:
      address: discovery:///collector
      enableKeepAlive: true
      keepAliveWithoutCalls: true
      negotiationType: plaintext
    analyzer:
      address: discovery:///analyzer
      enableKeepAlive: true
      keepAliveWithoutCalls: true
      negotiationType: plaintext

comments:
  max-per-user-per-event: 5

logging:
  level:
    ru.practicum: INFO
    org.springframework.web: INFO

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
