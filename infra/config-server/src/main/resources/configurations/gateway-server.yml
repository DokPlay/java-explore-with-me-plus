server:
  port: 8080

spring:
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            - id: main-service-api
              uri: lb://main-service
              predicates:
                - Path=/admin/**,/users/**,/events/**,/categories/**,/compilations/**,/locations/**
            - id: stats-service-api
              uri: lb://stats-service
              predicates:
                - Path=/hit,/stats

management:
  endpoint:
    gateway:
      access: unrestricted
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,info,gateway
