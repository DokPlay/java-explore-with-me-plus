server:
  port: 0
  address: 0.0.0.0

spring:
  datasource:
    driverClassName: org.postgresql.Driver
    url: ${STATS_DB_URL:jdbc:postgresql://localhost:5433/stats}
    username: ${STATS_DB_USER:postgres}
    password: ${STATS_DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    open-in-view: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
