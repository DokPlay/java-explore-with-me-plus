services:
  discovery-server:
    build: ./infra/discovery-server
    image: ewm-discovery-server
    container_name: discovery-server
    ports:
      - "8761:8761"
    environment:
      EUREKA_INSTANCE_HOSTNAME: discovery-server
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 40s

  config-server:
    build: ./infra/config-server
    image: ewm-config-server
    container_name: config-server
    depends_on:
      discovery-server:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
    healthcheck:
      test: ["CMD-SHELL", "body=$$(curl -fs http://discovery-server:8761/eureka/apps) && echo \"$$body\" | grep -q '<name>CONFIG-SERVER</name>' && echo \"$$body\" | grep -q '<status>UP</status>' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  stats-service:
    build: ./stats-service/stats-server
    image: ewm-stats-server
    container_name: stats-service
    depends_on:
      stats-db:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      STATS_DB_URL: jdbc:postgresql://stats-db:5432/stats
      STATS_DB_USER: postgres
      STATS_DB_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9091/actuator/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  stats-db:
    image: postgres:16
    container_name: stats-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: stats
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stats"]
      interval: 5s
      timeout: 5s
      retries: 10

  main-service:
    build: ./core/main-service
    image: ewm-main-service
    container_name: main-service
    depends_on:
      main-db:
        condition: service_healthy
      stats-service:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      MAIN_DB_URL: jdbc:postgresql://main-db:5432/main_db
      MAIN_DB_USER: postgres
      MAIN_DB_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/actuator/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  event-service:
    build: ./core/event-service
    image: ewm-event-service
    container_name: event-service
    depends_on:
      main-db:
        condition: service_healthy
      stats-service:
        condition: service_healthy
      main-service:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      MAIN_DB_URL: jdbc:postgresql://main-db:5432/main_db
      MAIN_DB_USER: postgres
      MAIN_DB_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/actuator/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  request-service:
    build: ./core/request-service
    image: ewm-request-service
    container_name: request-service
    depends_on:
      main-db:
        condition: service_healthy
      main-service:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      MAIN_DB_URL: jdbc:postgresql://main-db:5432/main_db
      MAIN_DB_USER: postgres
      MAIN_DB_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/actuator/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  user-admin-service:
    build: ./core/user-admin-service
    image: ewm-user-admin-service
    container_name: user-admin-service
    depends_on:
      main-db:
        condition: service_healthy
      main-service:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      MAIN_DB_URL: jdbc:postgresql://main-db:5432/main_db
      MAIN_DB_USER: postgres
      MAIN_DB_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/actuator/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  extra-service:
    build: ./core/extra-service
    image: ewm-extra-service
    container_name: extra-service
    depends_on:
      main-db:
        condition: service_healthy
      stats-service:
        condition: service_healthy
      main-service:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      MAIN_DB_URL: jdbc:postgresql://main-db:5432/main_db
      MAIN_DB_USER: postgres
      MAIN_DB_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/actuator/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  main-db:
    image: postgres:16
    container_name: main-db
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: main_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d main_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  gateway-server:
    build: ./infra/gateway-server
    image: ewm-gateway-server
    container_name: gateway-server
    ports:
      - "8080:8080"
      - "9090:8080"
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      main-service:
        condition: service_healthy
      event-service:
        condition: service_healthy
      request-service:
        condition: service_healthy
      user-admin-service:
        condition: service_healthy
      extra-service:
        condition: service_healthy
      stats-service:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 40s
